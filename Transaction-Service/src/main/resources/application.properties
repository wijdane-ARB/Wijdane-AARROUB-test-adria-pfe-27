spring.application.name=Transaction-Service
server.port=8082

spring.datasource.url=jdbc:h2:mem:transactiondb
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/transaction/graphiql

spring.config.import=optional:configserver:http://localhost:8888
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.cloud.openfeign.circuitbreaker.enabled=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=6
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10s
spring.kafka.admin.fail-fast=false
spring.ai.mcp.server.name=transaction-mcp-server