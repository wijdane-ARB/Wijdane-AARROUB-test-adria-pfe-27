server:
  port: 8081
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:accountdb
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  graphql:
    path: /account/graphql
    graphiql:
      enabled: true
      path: /account/graphiql
  ai:
    mcp:
      server:
        name: account-mcp-server
        version: 1.0.0
        type: SYNC
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info
