name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilation et tests
        run: mvn -B verify

  docker:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { module: config-service,      image: config-service }
          - { module: discovery-service,   image: discovery-service }
          - { module: Account-Service,     image: account-service }
          - { module: Transaction-Service, image: transaction-service }
          - { module: audit-service,       image: audit-service }
          - { module: gateway-service,     image: gateway-service }
          - { module: chatbot-service,     image: chatbot-service }
    steps:
      - uses: actions/checkout@v4
      - name: Owner en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ github.sha }}

  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploiement (schematique)
        run: |
          echo "Sur le serveur cible :"
          echo "  docker compose pull && docker compose up -d"
          echo "Image deployee : ${{ github.sha }}"
