x-java-service: &java-service
  restart: on-failure
  networks: [bank-net]

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    networks: [bank-net]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  config-service:
    <<: *java-service
    image: bank/config-service
    build:
      context: .
      args: { MODULE: config-service }
    container_name: config-service
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  discovery-service:
    <<: *java-service
    image: bank/discovery-service
    build:
      context: .
      args: { MODULE: discovery-service }
    container_name: discovery-service
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  account-service:
    <<: *java-service
    image: bank/account-service
    build:
      context: .
      args: { MODULE: Account-Service }
    container_name: account-service
    ports: ["8081:8081"]
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"

  transaction-service:
    <<: *java-service
    image: bank/transaction-service
    build:
      context: .
      args: { MODULE: Transaction-Service }
    container_name: transaction-service
    ports: ["8082:8082"]
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_started }
      account-service: { condition: service_started }
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-service:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  audit-service:
    <<: *java-service
    image: bank/audit-service
    build:
      context: .
      args: { MODULE: audit-service }
    container_name: audit-service
    ports: ["8083:8083"]
    depends_on:
      kafka: { condition: service_started }
      discovery-service: { condition: service_healthy }
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"

  gateway-service:
    <<: *java-service
    image: bank/gateway-service
    build:
      context: .
      args: { MODULE: gateway-service }
    container_name: gateway-service
    ports: ["8080:8080"]
    depends_on:
      discovery-service: { condition: service_healthy }
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"

  chatbot-service:
    <<: *java-service
    image: bank/chatbot-service
    build:
      context: .
      args: { MODULE: chatbot-service }
    container_name: chatbot-service
    ports: ["8090:8090"]
    depends_on:
      account-service: { condition: service_started }
      transaction-service: { condition: service_started }
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_AI_OLLAMA_BASE_URL: http://host.docker.internal:11434
      SPRING_AI_MCP_CLIENT_SSE_CONNECTIONS_ACCOUNT_URL: http://account-service:8081
      SPRING_AI_MCP_CLIENT_SSE_CONNECTIONS_TRANSACTION_URL: http://transaction-service:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"

networks:
  bank-net:
